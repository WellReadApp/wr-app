<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7B8A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E87968;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.85" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Book stack -->
  <!-- Bottom book -->
  <rect x="120" y="280" width="272" height="120" rx="8" fill="url(#bookGradient)" opacity="0.8"/>
  <rect x="120" y="280" width="20" height="120" rx="8" fill="#ffffff" opacity="0.6"/>
  
  <!-- Middle book -->
  <rect x="140" y="240" width="252" height="100" rx="8" fill="url(#bookGradient)" opacity="0.9"/>
  <rect x="140" y="240" width="18" height="100" rx="8" fill="#ffffff" opacity="0.7"/>
  
  <!-- Top book -->
  <rect x="160" y="200" width="232" height="80" rx="8" fill="url(#bookGradient)"/>
  <rect x="160" y="200" width="16" height="80" rx="8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Book details -->
  <line x1="190" y1="220" x2="360" y2="220" stroke="#E87968" stroke-width="3" opacity="0.7"/>
  <line x1="190" y1="235" x2="320" y2="235" stroke="#E87968" stroke-width="2" opacity="0.5"/>
  <line x1="190" y1="250" x2="340" y2="250" stroke="#E87968" stroke-width="2" opacity="0.5"/>
  
  <!-- Sparkle effects -->
  <circle cx="350" cy="160" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="380" cy="180" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="140" cy="170" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="110" cy="200" r="2" fill="#ffffff" opacity="0.5"/>
  
  <!-- Small reading icon -->
  <path d="M256 140 C246 140 238 148 238 158 L238 170 C238 180 246 188 256 188 C266 188 274 180 274 170 L274 158 C274 148 266 140 256 140 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M250 158 L262 158 M250 165 L262 165 M250 172 L262 172" stroke="#E87968" stroke-width="1.5" opacity="0.7"/>
</svg>