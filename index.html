<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WellRead - Personal Growth Library</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta tags for PWA -->
    <meta name="theme-color" content="#E87968" />
    <meta name="description" content="Your personal library for growth, learning, and knowledge. Discover, read, and grow with curated book recommendations." />
    
    <!-- Apple PWA specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WellRead" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Microsoft PWA specific -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#E87968" />
    
    <!-- Additional icon sizes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-152x152.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[SW] Registered successfully, scope:', registration.scope);
              
              // Check for updates immediately
              registration.update();
              
              // Check for updates periodically (every 5 minutes)
              setInterval(() => {
                registration.update();
              }, 5 * 60 * 1000);
              
              // Listen for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('[SW] Update found, installing new version...');
                
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    console.log('[SW] New worker state:', newWorker.state);
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[SW] New version installed, ready to activate');
                    }
                  });
                }
              });
            })
            .catch(function(error) {
              console.error('[SW] Registration failed:', error);
            });
          
          // Handle controller change (when new SW takes over)
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[SW] Controller changed, new version active');
          });
        });
      }
    </script>
  </body>
</html>
